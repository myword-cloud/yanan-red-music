<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红色音乐作品赏析 - 延安十三年红色音乐高校美育平台</title>
<style>
:root{--orange:#D35400;--orange-deep:#A04000;--gold:#F0D060;--cream:#FDF2E9;--text:#3A1A1A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Serif SC",serif;background:var(--cream);color:var(--text);line-height:1.8;}
header{background:var(--orange);padding:20px 40px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:14px;}
.logo-mark{width:44px;height:44px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--orange);font-weight:900;font-size:22px;}
.header-title{font-size:18px;font-weight:900;letter-spacing:2px;color:#fff;}
.header-nav a{color:#FFE8C8;text-decoration:none;margin-left:22px;font-size:14px;letter-spacing:2px;}
.header-nav a:hover{color:var(--gold);}
.page-banner{background:linear-gradient(135deg,#D35400,#A04000);color:#fff;text-align:center;padding:70px 40px 60px;}
.page-banner h1{font-size:46px;letter-spacing:10px;font-weight:900;margin-bottom:16px;}
.page-banner .gold-line{width:140px;height:3px;background:var(--gold);margin:0 auto;}
.content{max-width:900px;margin:0 auto;padding:60px 40px;}
.sub-title-box{display:inline-block;background:var(--orange-deep);color:var(--gold);padding:8px 26px;font-size:16px;letter-spacing:4px;font-weight:700;border-radius:2px;box-shadow:0 3px 10px rgba(160,64,0,.35);margin-bottom:20px;}
.detail-block{background:#fff;border-left:6px solid var(--orange);padding:30px 34px;margin-bottom:28px;box-shadow:0 6px 20px rgba(160,64,0,.1);border-radius:0 4px 4px 0;}
.detail-block h3{color:var(--orange-deep);font-size:22px;letter-spacing:4px;margin-bottom:12px;font-weight:800;}
.detail-block p{font-size:15px;color:#5A3A3A;letter-spacing:1px;}
.back-btn{display:inline-block;margin-top:20px;background:var(--orange-deep);color:var(--gold);padding:12px 40px;letter-spacing:4px;text-decoration:none;border-radius:2px;transition:.3s;}
.back-btn:hover{background:var(--gold);color:var(--orange-deep);}
footer{background:#3A1A1A;color:#C9A9A9;text-align:center;padding:20px;font-size:13px;letter-spacing:2px;margin-top:40px;}
footer span{color:var(--gold);}
@media(max-width:768px){
  .page-banner h1{font-size:28px;letter-spacing:6px;}
  .header-title{font-size:14px;}
  .header-nav a{margin-left:12px;font-size:12px;}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">延</div>
    <div class="header-title">延安十三年红色音乐高校美育平台</div>
  </div>
  <nav class="header-nav">
    <a href="index.html">首页</a >
    <a href="menu.html">学习板块</a >
    <a href="about.html">关于平台</a >
  </nav>
</header>

<section class="page-banner">
  <h1>红色音乐作品赏析</h1>
  <div class="gold-line"></div>
</section>

<section class="content">
  <div class="sub-title-box">经典作品</div>
  <div class="detail-block">
    <h3>红色音乐作品赏析</h3>
    <p>精选《山丹丹开花红艳艳》《黄河大合唱》《白毛女》等延安时期经典作品，从创作背景、音乐结构、思想内涵等角度进行赏析。</p >
  </div>

  <div class="sub-title-box">延安文艺纪念馆电子浏览</div>
  <div class="detail-block">
    <h3>延安文艺纪念馆电子浏览</h3>
    <p>以电子浏览形式呈现延安文艺纪念馆的相关资料，帮助学生直观了解延安文艺运动的历史现场。</p >
  </div>

  <a class="back-btn" href="menu.html">返回学习板块</a >
</section>

<footer>
  <p>延安十三年红色音乐高校美育平台 · <span>红色音乐赋能高校思政美育</span></p >
</footer>

</body>
</html>
