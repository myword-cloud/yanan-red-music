<style>
:root{--red-main:#B22222;--red-deep:#8B1A1A;--gold:#E6B422;--gold-light:#F5D76E;--cream:#FBF0E0;--text:#3A1A1A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Serif SC",serif;background:var(--red-main);color:#fff;min-height:100vh;line-height:1.8;padding-bottom:40px;}
header{background:var(--red-deep);padding:20px 40px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:14px;}
.logo-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--red-deep);font-weight:900;font-size:22px;animation:logoPulse 3s ease-in-out infinite;}
@keyframes logoPulse{0%,100%{box-shadow:0 0 0 rgba(230,180,34,0);}50%{box-shadow:0 0 20px rgba(230,180,34,.7);}}
.header-title{font-size:18px;font-weight:900;letter-spacing:2px;}
.header-nav a{color:#FFE8C8;text-decoration:none;margin-left:22px;font-size:14px;letter-spacing:2px;transition:.3s;}
.header-nav a:hover{color:var(--gold-light);text-shadow:0 0 10px var(--gold);}

.page-title{text-align:center;padding:60px 40px 20px;}
.page-title h1{font-size:44px;letter-spacing:8px;font-weight:900;margin-bottom:12px;color:var(--gold-light);text-shadow:2px 2px 0 rgba(0,0,0,.15),0 0 30px rgba(230,180,34,.25);animation:titleFade 1.2s ease-out;}
@keyframes titleFade{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
.page-title .gold-line{width:120px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 16px;animation:lineExpand 1.2s ease-out;}
@keyframes lineExpand{from{width:0;opacity:0;}to{width:120px;opacity:1;}}
.page-title p{font-size:16px;color:#FFE8C8;letter-spacing:4px;}

.grid{max-width:1000px;margin:30px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:0 40px;}
.grid-item{
  background:var(--cream);
  color:var(--red-deep);
  border:2px solid var(--gold);
  border-radius:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.15);
  padding:44px 20px;
  text-align:center;text-decoration:none;
  font-size:17px;font-weight:700;letter-spacing:3px;
  transition:.4s;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:140px;
  opacity:0;
  animation:cardIn .6s ease-out forwards;
}
.grid-item:nth-child(1){animation-delay:.1s;}
.grid-item:nth-child(2){animation-delay:.2s;}
.grid-item:nth-child(3){animation-delay:.3s;}
.grid-item:nth-child(4){animation-delay:.4s;}
.grid-item:nth-child(5){animation-delay:.5s;}
.grid-item:nth-child(6){animation-delay:.6s;}
@keyframes cardIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.grid-item::before{content:"";position:absolute;top:50%;left:50%;width:0;height:0;background:radial-gradient(circle,rgba(230,180,34,.6),transparent 70%);transform:translate(-50%,-50%);transition:.5s;border-radius:50%;}
.grid-item:hover::before{width:300px;height:300px;}
.grid-item:hover{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--red-deep);transform:translateY(-6px) scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.35);border-color:var(--gold-light);}
.grid-item .num{font-size:13px;color:var(--red-main);letter-spacing:2px;margin-bottom:10px;font-weight:400;position:relative;z-index:2;}
.grid-item:hover .num{color:var(--red-deep);}
.grid-item span{position:relative;z-index:2;}

footer{background:#2A0A0A;color:#C9A9A9;text-align:center;padding:20px;font-size:13px;letter-spacing:2px;margin-top:60px;}
footer span{color:var(--gold);animation:footerGlow 3s ease-in-out infinite;display:inline-block;}
@keyframes footerGlow{0%,100%{opacity:.8;}50%{opacity:1;text-shadow:0 0 10px var(--gold);}}

@media(max-width:768px){.grid{grid-template-columns:1fr;}.page-title h1{font-size:28px;letter-spacing:4px;}.header-title{font-size:14px;}.header-nav a{margin-left:12px;font-size:12px;}}
</style>
