<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>听见延安十三年 - 延安十三年红色音乐高校美育平台</title>
<style>
:root{
  --red-main:#B22222;--red-deep:#8B1A1A;
  --gold:#E6B422;--gold-light:#F5D76E;
  --cream:#FBF0E0;--text:#3A1A1A;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Noto Serif SC",serif;
  background:#8B1A1A;color:#fff;line-height:1.6;min-height:100vh;
}

/* ===== 顶部页眉 ===== */
header{
  background:linear-gradient(135deg,#B22222,#8B1A1A);
  padding:16px 40px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
  position:relative;z-index:10;
}
.header-left{display:flex;align-items:center;gap:12px;}
.logo-mark{
  width:40px;height:40px;border-radius:6px;
  background:linear-gradient(135deg,#E6B422,#F5D76E);
  display:flex;align-items:center;justify-content:center;
  color:#8B1A1A;font-weight:900;font-size:20px;
}
.header-title{font-size:16px;font-weight:900;letter-spacing:2px;color:#fff;}
.header-right{
  display:flex;align-items:center;gap:16px;
  font-size:13px;color:#FFE8C8;letter-spacing:2px;
}
#login-btn{
  display:inline-block;
  background:#fff;color:#B22222;
  font-size:13px;font-weight:900;letter-spacing:2px;
  padding:7px 18px;border-radius:4px;
  cursor:pointer;transition:.3s;
  border:2px solid #fff;
}
#login-btn:hover{background:transparent;color:#F5D76E;border-color:#F5D76E;}

/* ===== 主视觉区 ===== */
.hero{
  min-height:calc(100vh - 72px);
  display:grid;
  grid-template-columns:1fr 1.2fr;
  align-items:center;
  padding:40px 60px;
  gap:40px;
  background:
    radial-gradient(circle at 20% 30%,rgba(230,180,34,.15),transparent 45%),
    radial-gradient(circle at 80% 70%,rgba(178,34,34,.6),transparent 55%),
    linear-gradient(135deg,#B22222 0%,#8B1A1A 100%);
  position:relative;
  overflow:hidden;
}

/* 左侧插画区：整块铺满 */
.hero-visual{
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:2;
  height:100%;
  min-height:520px;
}
.visual-bg{
  width:100%;
  height:100%;
  min-height:520px;
  background-image:url('banner.jpg');
  background-size:cover;
  background-position:center;
  border-radius:12px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  animation:visualFloat 5s ease-in-out infinite;
}
@keyframes visualFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

/* 右侧内容区 */
.hero-content{
  position:relative;z-index:2;
}
.hero-title{
  text-align:center;
  margin-bottom:30px;
}
.hero-title h1{
  font-size:52px;
  font-weight:900;
  letter-spacing:8px;
  background:linear-gradient(90deg,#F5D76E 0%,#FFF8D0 50%,#F5D76E 100%);
  background-size:200% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:goldFlow 4s linear infinite;
  margin-bottom:14px;
  text-shadow:0 0 30px rgba(230,180,34,.3);
}
@keyframes goldFlow{
  0%{background-position:0% center;}
  100%{background-position:200% center;}
}
.hero-sub{
  display:flex;align-items:center;justify-content:center;gap:18px;
  font-size:20px;color:#F5D76E;letter-spacing:4px;font-weight:700;
}
.hero-sub::before,.hero-sub::after{
  content:"";width:60px;height:2px;
  background:linear-gradient(90deg,transparent,#F5D76E,transparent);
}

/* 6 个板块网格：上三下三 */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:36px;
}
.card{
  background:#fff;
  border-radius:10px;
  padding:26px 14px;
  text-align:center;
  color:#3A1A1A;
  transition:.35s;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:10px;
  min-height:140px;
  box-shadow:0 6px 20px rgba(0,0,0,.15);
  position:relative;overflow:hidden;
  cursor:default;
}
.card .num{
  font-size:14px;
  color:#B22222;
  letter-spacing:3px;
  font-weight:400;
  opacity:.7;
}
.card .name{
  font-size:16px;
  font-weight:900;
  letter-spacing:2px;
  color:#3A1A1A;
  line-height:1.4;
}
.card:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 14px 32px rgba(0,0,0,.3);
  background:linear-gradient(135deg,#E6B422,#F5D76E);
}
.card:hover .num,
.card:hover .name{color:#8B1A1A;}

/* 进入按钮 */
.enter-btn-wrap{text-align:center;}
.enter-btn{
  display:inline-block;
  background:linear-gradient(135deg,#E6B422,#F5D76E);
  color:#8B1A1A;
  padding:16px 60px;
  border-radius:6px;
  font-size:18px;
  font-weight:900;
  letter-spacing:6px;
  text-decoration:none;
  transition:.3s;
  box-shadow:0 8px 24px rgba(230,180,34,.4);
  animation:btnBreath 2.4s ease-in-out infinite;
}
@keyframes btnBreath{
  0%,100%{box-shadow:0 8px 24px rgba(230,180,34,.4);transform:scale(1);}
  50%{box-shadow:0 10px 34px rgba(230,180,34,.9);transform:scale(1.04);}
}
.enter-btn:hover{
  background:linear-gradient(135deg,#B22222,#8B1A1A);
  color:#F5D76E;
  animation:none;transform:scale(1.08);
}

footer{
  background:#2A0A0A;color:#C9A9A9;
  text-align:center;padding:20px;
  font-size:13px;letter-spacing:2px;
}
footer span{color:var(--gold);}

@media(max-width:1100px){
  .hero{grid-template-columns:1fr;padding:40px 30px;}
  .hero-visual{min-height:360px;}
  .visual-bg{min-height:360px;}
  .hero-title h1{font-size:36px;letter-spacing:5px;}
}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .hero-title h1{font-size:26px;letter-spacing:3px;}
  .hero-sub{font-size:14px;}
  .card{min-height:110px;padding:16px 8px;}
  .card .name{font-size:12px;}
  .card .num{font-size:11px;}
  .enter-btn{padding:12px 36px;font-size:15px;letter-spacing:3px;}
  .header-title{font-size:12px;}
}
  /* 6 种编号颜色 */
.card.c1 .num{color:#5A9E96;}
.card.c2 .num{color:#5B8AA6;}
.card.c3 .num{color:#E89545;}
.card.c4 .num{color:#C9A96E;}
.card.c5 .num{color:#A88FC0;}
.card.c6 .num{color:#E66A63;}
</style>
</head>

<!-- ===== 登录系统 ===== -->
<div id="login-mask">
  <div id="login-box">
    <div class="login-head">
      <span id="login-title">登录 · 延安红色音乐平台</span>
      <span class="login-close" onclick="closeLogin()">✕</span>
    </div>

      <div id="reg-pass2-wrap" style="display:none;">

        <input type="password" id="login-pass2" placeholder="请再次输入密码">
      </div>
      <div id="login-tip"></div>
      <button id="login-submit" onclick="doSubmit()">登 录</button>
      <div class="login-switch">
        <span id="switch-text">还没有账号？</span>
        <a onclick="switchMode()" id="switch-btn">立即注册</a >
      </div>
    </div>
  </div>
</div>

<style>
#login-mask{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.55);z-index:9999;
  align-items:center;justify-content:center;
}
#login-mask.open{display:flex;}
#login-box{
  width:380px;background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:loginIn .3s ease-out;border:2px solid var(--gold);
}
@keyframes loginIn{
  from{opacity:0;transform:translateY(-20px) scale(.95);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.login-head{
  background:linear-gradient(135deg,#B22222,#8B1A1A);
  color:#F5D76E;padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;
  font-weight:900;letter-spacing:2px;font-size:15px;
}
.login-close{cursor:pointer;font-size:18px;}
.login-body{padding:26px 24px;}
.login-body label{
  display:block;font-size:13px;color:#8B1A1A;
  font-weight:700;letter-spacing:2px;
  margin-bottom:6px;margin-top:14px;
}
.login-body label:first-child{margin-top:0;}
.login-body input{
  width:100%;padding:10px 14px;
  border:2px solid #FBF0E0;border-radius:4px;
  font-size:14px;font-family:inherit;
  transition:.3s;outline:none;
}
.login-body input:focus{border-color:#E6B422;}
.login-body button{
  width:100%;margin-top:20px;
  background:linear-gradient(135deg,#E6B422,#F5D76E);
  color:#8B1A1A;border:none;padding:12px;
  font-size:15px;font-weight:900;letter-spacing:4px;
  border-radius:4px;cursor:pointer;transition:.3s;
  font-family:inherit;
}
.login-body button:hover{
  background:linear-gradient(135deg,#B22222,#8B1A1A);
  color:#F5D76E;
}
#login-tip{
  font-size:13px;color:#B22222;
  margin-top:10px;text-align:center;min-height:18px;
}
.login-switch{
  text-align:center;margin-top:16px;
  font-size:13px;color:#8B1A1A;
}
.login-switch a{
  color:#B22222;font-weight:900;
  cursor:pointer;text-decoration:underline;
  margin-left:6px;
}
</style>

<script>
var USERS_KEY = "yanan_users";
(function initDefaultUser(){
  var users = JSON.parse(localStorage.getItem(USERS_KEY) || "{}");
  if(!users["admin"]){
    users["admin"] = "123456";
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
  }
})();

var isRegisterMode = false;

function openLogin(){
  isRegisterMode = false;
  updateLoginUI();
  document.getElementById('login-mask').classList.add('open');
  document.getElementById('login-tip').textContent = "";
}
function closeLogin(){
  document.getElementById('login-mask').classList.remove('open');
  document.getElementById('login-user').value = "";
  document.getElementById('login-pass').value = "";
  document.getElementById('login-pass2').value = "";
  document.getElementById('login-tip').textContent = "";
}
function switchMode(){
  isRegisterMode = !isRegisterMode;
  document.getElementById('login-tip').textContent = "";
  updateLoginUI();
}
function updateLoginUI(){
  var title = document.getElementById('login-title');
  var submit = document.getElementById('login-submit');
  var switchText = document.getElementById('switch-text');
  var switchBtn = document.getElementById('switch-btn');
  var pass2 = document.getElementById('reg-pass2-wrap');

  if(isRegisterMode){
    title.textContent = "注册 · 延安红色音乐平台";
    submit.textContent = "注 册";
    switchText.textContent = "已有账号？";
    switchBtn.textContent = "去登录";
    pass2.style.display = "block";
  } else {
    title.textContent = "登录 · 延安红色音乐平台";
    submit.textContent = "登 录";
    switchText.textContent = "还没有账号？";
    switchBtn.textContent = "立即注册";
    pass2.style.display = "none";
  }
}
function doSubmit(){
  if(isRegisterMode){ doRegister(); }
  else{ doLogin(); }
}
function doRegister(){
  var u = document.getElementById('login-user').value.trim();
  var p = document.getElementById('login-pass').value;
  var p2 = document.getElementById('login-pass2').value;
  var tip = document.getElementById('login-tip');

  if(!u || !p){ tip.textContent = "用户名和密码不能为空"; return; }
  if(p !== p2){ tip.textContent = "两次密码输入不一致"; return; }

  var users = JSON.parse(localStorage.getItem(USERS_KEY) || "{}");
  if(users[u]){ tip.textContent = "用户名已存在"; return; }

  users[u] = p;
  localStorage.setItem(USERS_KEY, JSON.stringify(users));

  tip.style.color = "#1A7A1A";
  tip.textContent = "注册成功，请登录";
  isRegisterMode = false;
  updateLoginUI();
  setTimeout(function(){ tip.style.color = "#B22222"; tip.textContent = ""; }, 1500);
}
function doLogin(){
  var u = document.getElementById('login-user').value.trim();
  var p = document.getElementById('login-pass').value;
  var tip = document.getElementById('login-tip');

  if(!u || !p){ tip.textContent = "用户名和密码不能为空"; return; }

  var users = JSON.parse(localStorage.getItem(USERS_KEY) || "{}");
  if(users[u] && users[u] === p){
    closeLogin();
    var btn = document.getElementById('login-btn');
    btn.textContent = "你好，" + u + "（退出）";
    btn.onclick = function(){ logout(); };
  } else {
    tip.textContent = "用户名或密码错误，请重试";
  }
}
function logout(){
  var btn = document.getElementById('login-btn');
  btn.textContent = "登录";
  btn.onclick = function(){ openLogin(); };
}
</script>
<!-- ===== 登录系统结束 ===== -->
