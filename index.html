<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>听见延安十三年 - 延安十三年红色音乐高校美育平台</title>
<style>
:root{--orange:#D35400;--orange-deep:#A04000;--gold:#F0D060;--cream:#FDF2E9;--text:#3A1A1A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Serif SC",serif;background:var(--cream);color:var(--text);line-height:1.8;min-height:100vh;display:flex;flex-direction:column;}
header{background:var(--orange);color:#fff;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(211,84,0,.3);}
.header-left{display:flex;align-items:center;gap:14px;}
.logo-mark{width:44px;height:44px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--orange);font-weight:900;font-size:22px;}
.header-title{font-size:18px;font-weight:900;letter-spacing:2px;line-height:1.3;}
.header-right{font-size:14px;color:#FFE8C8;letter-spacing:2px;}
.hero{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 84px);}
.hero-visual{background:linear-gradient(135deg,#D35400,#A04000);display:flex;align-items:center;justify-content:center;padding:40px;}
.hero-visual .photo-placeholder{width:100%;max-width:480px;height:360px;background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.5);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#FFE8C8;font-size:15px;letter-spacing:2px;}
.hero-text{background:var(--orange);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:60px 70px;color:#fff;}
.hero-text .small-gold{font-size:16px;color:var(--gold);letter-spacing:4px;margin-bottom:20px;}
.hero-text h1{font-size:60px;font-weight:900;letter-spacing:10px;margin-bottom:16px;text-shadow:2px 2px 0 rgba(0,0,0,.15);}
.hero-text .sub{font-size:16px;color:#FFE8C8;letter-spacing:3px;margin-bottom:48px;}
.hero-text .btn{display:inline-block;background:transparent;color:#fff;border:2px solid #fff;padding:14px 48px;font-size:17px;letter-spacing:6px;text-decoration:none;border-radius:2px;transition:.3s;}
.hero-text .btn:hover{background:#fff;color:var(--orange);}
footer{background:#3A1A1A;color:#C9A9A9;text-align:center;padding:20px;font-size:13px;letter-spacing:2px;}
footer span{color:var(--gold);}
@media(max-width:900px){
  .hero{grid-template-columns:1fr;}
  .hero-visual{min-height:300px;}
  .hero-text{padding:50px 30px;}
  .hero-text h1{font-size:38px;letter-spacing:6px;}
  .header-title{font-size:14px;}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">延</div>
    <div class="header-title">延安十三年红色音乐高校美育平台</div>
  </div>
  <div class="header-right">红色音乐 · 思政美育</div>
</header>

<section class="hero">
  <div class="hero-visual">
    <div class="photo-placeholder">延安调研照片占位区</div>
  </div>
  <div class="hero-text">
    <div class="small-gold">一家专业的红色美育平台</div>
    <h1>听见延安十三年</h1>
    <div class="sub">红色音乐赋能高校思政美育</div>
    <a class="btn" href=" ">点击学习</a >
  </div>
</section>

<footer>
  <p>延安十三年红色音乐高校美育平台 · <span>红色音乐赋能高校思政美育</span></p >
</footer>

</body>
</html>
