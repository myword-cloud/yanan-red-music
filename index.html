
<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>听见延安十三年 - 延安十三年红色音乐高校美育平台</title>
<style>
:root{--red-main:#B22222;--red-deep:#8B1A1A;--gold:#E6B422;--gold-light:#F5D76E;--cream:#FBF0E0;--text:#3A1A1A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Serif SC",serif;background:var(--cream);color:var(--text);line-height:1.8;min-height:100vh;display:flex;flex-direction:column;}
header{background:var(--red-main);color:#fff;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(178,34,34,.35);}
.header-left{display:flex;align-items:center;gap:14px;}
.logo-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--red-deep);font-weight:900;font-size:22px;animation:logoPulse 3s ease-in-out infinite;}
@keyframes logoPulse{0%,100%{box-shadow:0 0 0 rgba(230,180,34,0);}50%{box-shadow:0 0 20px rgba(230,180,34,.7);}}
.header-title{font-size:18px;font-weight:900;letter-spacing:2px;line-height:1.3;}
.header-right{font-size:14px;color:var(--gold-light);letter-spacing:2px;}
.hero{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 84px);}
.hero-visual{background:linear-gradient(135deg,var(--red-main),var(--red-deep));display:flex;align-items:center;justify-content:center;padding:40px;position:relative;overflow:hidden;}
.hero-visual::before{content:"★";position:absolute;font-size:400px;color:rgba(230,180,34,.06);animation:starSpin 40s linear infinite;pointer-events:none;}
@keyframes starSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.hero-visual .photo-placeholder{width:100%;max-width:480px;height:360px;background:rgba(255,255,255,.1);border:2px dashed rgba(230,180,34,.6);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-size:15px;letter-spacing:2px;position:relative;z-index:2;animation:borderGlow 3s ease-in-out infinite;}
@keyframes borderGlow{0%,100%{border-color:rgba(230,180,34,.5);box-shadow:0 0 0 rgba(230,180,34,0);}50%{border-color:rgba(245,215,110,1);box-shadow:0 0 24px rgba(230,180,34,.5);}}
.hero-text{background:var(--red-main);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:60px 70px;color:#fff;}
.hero-text .small-gold{font-size:16px;color:var(--gold);letter-spacing:4px;margin-bottom:20px;}
.hero-text h1{font-size:60px;font-weight:900;letter-spacing:10px;margin-bottom:16px;background:linear-gradient(90deg,#E6B422 0%,#F5D76E 50%,#E6B422 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldFlow 4s linear infinite;}
@keyframes goldFlow{0%{background-position:0% center;}100%{background-position:200% center;}}
.hero-text .sub{font-size:16px;color:#FFE8C8;letter-spacing:3px;margin-bottom:48px;}
.hero-text .btn{display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--red-deep);border:2px solid var(--gold-light);padding:14px 48px;font-size:17px;letter-spacing:6px;font-weight:700;text-decoration:none;border-radius:2px;transition:.3s;box-shadow:0 4px 14px rgba(230,180,34,.3);animation:btnBreath 2.4s ease-in-out infinite;}
@keyframes btnBreath{0%,100%{transform:scale(1);box-shadow:0 4px 14px rgba(230,180,34,.3);}50%{transform:scale(1.05);box-shadow:0 6px 28px rgba(230,180,34,.7);}}
.hero-text .btn:hover{background:var(--red-deep);color:var(--gold-light);animation:none;transform:scale(1.08);}
footer{background:#2A0A0A;color:#C9A9A9;text-align:center;padding:20px;font-size:13px;letter-spacing:2px;}
footer span{color:var(--gold);animation:footerGlow 3s ease-in-out infinite;display:inline-block;}
@keyframes footerGlow{0%,100%{opacity:.8;}50%{opacity:1;text-shadow:0 0 10px var(--gold);}}
@media(max-width:900px){.hero{grid-template-columns:1fr;}.hero-visual{min-height:300px;}.hero-text{padding:50px 30px;}.hero-text h1{font-size:38px;letter-spacing:6px;}.header-title{font-size:14px;}}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">延</div>
    <div class="header-title">延安十三年红色音乐高校美育平台</div>
  </div>
  <div class="header-right">红色音乐 · 思政美育</div>
</header>

<section class="hero">
  <div class="hero-visual">
    <div class="photo-placeholder">延安调研照片占位区</div>
  </div>
  <div class="hero-text">
    <div class="small-gold">一家专业的红色美育平台</div>
    <h1>听见延安十三年</h1>

    <a class="btn" href="menu.html">点击学习</a >
  </div>
</section>

<footer>
  <p>延安十三年红色音乐高校美育平台 · <span>红色音乐赋能高校思政美育</span></p >
</footer>
